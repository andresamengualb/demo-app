name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [closed]  # solo necesitamos 'closed' para evaluar si fue merge

jobs:
  # Cerrar preview cuando se cierra el PR (mergeado o no)
  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close PR Preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"

  # Deploy a producción SOLO en push a main o PR mergeado a main
  prod_deploy:
    # push a main  OR  (PR closed AND merged AND base=main)
    if: github.event_name == 'push'
        || (github.event_name == 'pull_request'
            && github.event.action == 'closed'
            && github.event.pull_request.merged == true
            && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # (Opcional) si lo necesitas para tu build
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const core = require('@actions/core');
            return await core.getIDToken();
          result-encoding: string

      - name: Build & Deploy (SWA)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_PLANT_03B840310 }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
          github_id_token: ${{ steps.idtoken.outputs.result }}

# (Opcional) evita carreras/dobles despliegues si coinciden eventos
concurrency:
  group: prod-deploy
  cancel-in-progress: true
